<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск вакансий – Трекер</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/static/index.html">Трекер</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/static/index.html">Главная</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/static/vacancies.html">Поиск</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/static/my_vacancies.html">Мои вакансии</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <!-- Форма поиска -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Поиск новых вакансий на trudvsem.ru</h5>
          <div class="row">
            <div class="col-md-6">
              <label for="searchQuery" class="form-label">Ключевые слова</label>
              <input
                type="text"
                class="form-control"
                id="searchQuery"
                placeholder="например: python developer"
              />
            </div>
            <div class="col-md-4">
              <label for="searchArea" class="form-label">Город</label>
              <select id="searchArea" class="form-select">
                <option value="1">Москва</option>
                <option value="2">Санкт-Петербург</option>
                <option value="4">Новосибирск</option>
                <option value="62">Краснодар</option>
              </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button id="searchBtn" class="btn btn-primary w-100">Найти</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Результаты поиска -->
      <h3>Результаты поиска</h3>
      <div id="searchResults" class="row">
        <div class="col-12 text-muted">Введите запрос и нажмите "Найти"</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function (m) {
          if (m === "&") return "&amp;";
          if (m === "<") return "&lt;";
          if (m === ">") return "&gt;";
          return m;
        });
      }

      async function performSearch() {
        const query = document.getElementById("searchQuery").value.trim();
        if (!query) {
          alert("Введите ключевые слова");
          return;
        }
        const area = document.getElementById("searchArea").value;
        const resultsContainer = document.getElementById("searchResults");
        resultsContainer.innerHTML =
          '<div class="col-12 text-center"><div class="spinner-border text-primary" role="status"></div></div>';
        try {
          const response = await fetch(
            `/vacancies/search?query=${encodeURIComponent(query)}&area=${area}`
          );
          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Ошибка ${response.status}: ${errText}`);
          }
          const data = await response.json();
          if (data.length === 0) {
            resultsContainer.innerHTML =
              '<div class="col-12">Не найдено новых вакансий по вашему запросу (или все уже были сохранены).</div>';
          } else {
            let html = "";
            for (let vac of data) {
              html += `
                <div class="col-md-6 col-lg-4 mb-3">
                  <div class="card h-100">
                    <div class="card-body">
                      <h5 class="card-title">${escapeHtml(vac.title)}</h5>
                      <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(vac.company)}</h6>
                      <a href="${escapeHtml(vac.url)}" target="_blank" class="btn btn-sm btn-outline-primary">Открыть</a>
                      <span class="badge bg-success ms-2">Новое</span>
                    </div>
                  </div>
                </div>
              `;
            }
            resultsContainer.innerHTML = html;
          }
        } catch (err) {
          resultsContainer.innerHTML = `<div class="col-12 text-danger">Ошибка: ${err.message}</div>`;
        }
      }

      document.getElementById("searchBtn").addEventListener("click", performSearch);
    </script>
  </body>
</html>
